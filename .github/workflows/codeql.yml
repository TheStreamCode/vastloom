name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 3"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Code scanning is available when the repository is public or GitHub Advanced
    # Security has been enabled explicitly for the private repository.
    if: github.event.repository.visibility == 'public' || vars.VASTLOOM_ENABLE_GHAS == 'true'
    name: Analyze ${{ matrix.language }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
      - name: Configure C++
        if: matrix.language == 'c-cpp'
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DVASTLOOM_BUILD_TESTS=OFF
          -DVASTLOOM_WARNINGS_AS_ERRORS=ON
      - name: Build C++
        if: matrix.language == 'c-cpp'
        run: cmake --build build --parallel
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
