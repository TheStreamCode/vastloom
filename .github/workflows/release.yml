name: Release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Refuse tag/version drift
        run: >-
          python -c "import re,sys,pathlib; tag='${{ github.ref_name }}';
          project_version=re.search(r'project\(\s*\w+\s+VERSION\s+([0-9][^\s)]*)',pathlib.Path('CMakeLists.txt').read_text()).group(1);
          tag_version=tag[1:] if tag.startswith('v') else tag;
          sys.exit(f'tag {tag} does not match CMake project version {project_version}') if not tag_version.startswith(project_version) else print(f'tag {tag} matches project version {project_version}')"
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DVASTLOOM_BUILD_TESTS=ON
          -DVASTLOOM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vastloom-${{ runner.os }}-${{ github.ref_name }}
          path: |
            vastloom-*.tar.gz
            vastloom-*.zip
            vastloom-*.sha256
          if-no-files-found: error
