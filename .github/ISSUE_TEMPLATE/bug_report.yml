name: Bug report
description: Report a reproducible Vastloom defect
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Do not report vulnerabilities here; use SECURITY.md. Never attach model weights, credentials or private prompts."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.4.0-alpha.4 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, compiler, CPU, GPU, RAM, model ID and exact revision.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands and inputs that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Redact paths or data you do not want public.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I did not include secrets, private prompts or model weights.
          required: true
        - label: This is not a security vulnerability.
          required: true
