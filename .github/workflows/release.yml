name: Release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DVASTLOOM_BUILD_TESTS=ON
          -DVASTLOOM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vastloom-${{ runner.os }}-${{ github.ref_name }}
          path: |
            vastloom-*.tar.gz
            vastloom-*.zip
            vastloom-*.sha256
          if-no-files-found: error
